}

function renderButtons() {
  const endBtn = document.getElementById('btn-end-phase');
  const killBtn = document.getElementById('btn-kill');
  if (G.phase==='placement') {
    endBtn.textContent = 'Pasar a Acción';
    endBtn.disabled = G.placedRes.length===0;
    killBtn.disabled = true;
  } else if (G.phase==='action') {
    endBtn.textContent = 'Pasar a Mantenimiento';
    endBtn.disabled = false;
    killBtn.disabled = !G.killUsedThisTurn === false ? false : true;
    killBtn.disabled = G.killUsedThisTurn || !hasGun();
  } else if (G.phase==='maintenance') {
    endBtn.textContent = 'Siguiente turno';
    endBtn.disabled = false;
    killBtn.disabled = true;
  } else {
    endBtn.disabled = true;
    killBtn.disabled = true;
  }
}

function hasGun() {
  return (G.resources.gun||0)>0 && G.placedPatrols.some(p=>p.type==='militia');
}

// ---------- Click handlers ----------
function onMissionCardClick(missionId) {
  if (G.gameOver) return;
  const m=G.missions.find(x=>x.id===missionId);
  if (!m || m.workerHere !== true) return;
  const slot=missionSlotForMission(missionId);
  if (!slot) return;
  if (G.phase==='placement') {
    if (G.missionWorkers[missionId]) { setPrompt('Ya hay un trabajador destinado a esta misión.'); return; }
    if (placedAvailableWorkers() >= availableResistanceWorkers()) { setPrompt('No quedan trabajadores disponibles en la Casa Segura.'); return; }
    G.placedRes.push({loc:slot, missionId});
    log(`Colocas un trabajador en ${m.title}.`);
    if (m.id==='coded_messages') {
      if (G.missionFlags.cm_placed_day===null || G.missionFlags.cm_placed_day===undefined) G.missionFlags.cm_placed_day=G.day;
      G.missionWorkers[m.id]={loc:slot,sinceDay:G.day,untilDay:10};
      G.missionFlags.cm_worker_present=true;
    }
    for (const mm of G.missions) tryMarkMission(mm.id);
    if (G.placedPatrols.length < numPatrols()) placeOnePatrol();
    while (placedAvailableWorkers() >= availableResistanceWorkers() && G.placedPatrols.length < numPatrols()) placeOnePatrol();
    render(); return;
  }
  if (G.phase==='action') {
    if (!G.placedRes.some(p=>p.loc===slot)) { setPrompt(G.missionWorkers[missionId]?'El trabajador permanece aquí.':'No hay tu trabajador en esta misión.'); return; }
    handleMissionAction(missionId,slot); render();
  }
}
function handleMissionAction(missionId,slot) {
  const f=G.missionFlags, m=G.missions.find(x=>x.id===missionId);
  if (!m) return;
  if (m.id==='sabotage') {
    if ((f.sab_infiltrations||0)<2) {
      f.sab_infiltrations=(f.sab_infiltrations||0)+1;
      log(`🕵️ Sabotaje: infiltración ${f.sab_infiltrations}/2.`);
    } else {
      if ((G.resources.bomb||0)<1) { setPrompt('Sabotaje: necesitas 1 Explosivo.'); return; }
      G.resources.bomb--; G.supply.bomb++; f.sab_explosives_delivered=true;
      log('💣 Sabotaje: Explosivos entregados.');
    }
    G.actionUsedThisTurn[slot]=true; tryMarkMission(m.id); returnPawn(slot); return;
  }
  if (m.id==='coded_messages') {
    if (G.day>10) { setPrompt('Mensajes Cifrados ya ha terminado.'); return; }
    G.actionUsedThisTurn[slot]=true; f.cm_worker_present=true;
    log('📜 Mensajes Cifrados: el trabajador permanece aquí.');
    tryMarkMission(m.id); return;
  }
  setPrompt(`${m.title}: esta misión aún no tiene su acción interactiva definida.`);
}

function onLocClick(id) {
  if (G.gameOver) return;
  const L = LOCATIONS.find(l=>l.id===id);

  if (G.phase==='placement') {
    // Cannot place at Casa Segura — workers are already there
    if (id === 'safe') {
      setPrompt('La Casa Segura es tu base — los trabajadores ya están ahí.'); return;
    }
    // Place resistance pawn if empty
    const occ = G.placedPatrols.find(p=>p.loc===id) || G.placedRes.find(p=>p.loc===id);
    if (occ) { setPrompt('Esa posición ya está ocupada.'); return; }
    if (placedAvailableWorkers() >= availableResistanceWorkers()) { setPrompt('No quedan trabajadores disponibles en la Casa Segura.'); return; }
    // Check blocked locations (Bomb for Officer)
    if (G.blockedLocations && G.blockedLocations.has(id)) {
      setPrompt('Esta ubicación está bloqueada por una misión.'); return;
    }
    // Check destroyed bridges
    if (G.destroyedBridges && G.destroyedBridges.has(id)) {
      setPrompt('Este puente está destruido.'); return;
    }
    G.placedRes.push({loc:id});
    log(`Colocas peón en ${L.name}`);
    // Animate: highlight the safe-house pawn that just left
    queueAnim('deploy');
    // Mansión del Oficial: marking Rue/Pont Lévêque/Pont du Nord
    if (G.missionFlags && ['rue','pont_lev','pont_n'].includes(id)) {
      const omMission = G.missions.find(m => m.id === 'officer_mansion');
      if (omMission) {
        if (!G.missionFlags.om_set) G.missionFlags.om_set = new Set();
        if (!G.missionFlags.om_set.has(id)) {
          G.missionFlags.om_set.add(id);
          log(`🏛️ Mansión del Oficial: ${locName(id)} marcada (${G.missionFlags.om_set.size}/3).`);
        }
      }
    }
    // Mansión del Oficial: completar al colocar en Mercado Negro
    if (G.missionFlags && id === 'mercado') {
      const omMission = G.missions.find(m => m.id === 'officer_mansion');
      if (omMission) {
        if (G.missionFlags.om_set && G.missionFlags.om_set.size >= 3) {
          log('🏛️ Mansión del Oficial: ¡completa!');
          tryMarkMission('officer_mansion');
        }
      }
    }
    // Check all missions for completion
    for (const m of G.missions) tryMarkMission(m.id);
    // After each pawn placement, place exactly one patrol (alternating turns).
    if (G.placedPatrols.length < numPatrols()) {
      placeOnePatrol();
    }
    // If no more player pawns to place but patrols remain, place the rest.
    while (placedAvailableWorkers() >= availableResistanceWorkers() && G.placedPatrols.length < numPatrols()) {
      placeOnePatrol();
    }
    render();
    return;
  }

  if (G.phase==='action') {
    // Click a pawn location to attempt return-to-safe or action
    const rp = G.placedRes.find(p=>p.loc===id);
    if (!rp) {
      setPrompt('No hay tu peón aquí. Pulsa "Pasar a Mantenimiento" si terminaste.');
      return;
    }
    handleAction(id);
    render();
    return;
  }
}

function placeOnePatrol() {
  if (G.placedPatrols.length >= numPatrols()) return;
  if (G.patrolDeck.length === 0) {
    G.patrolDeck = G.patrolDiscard; G.patrolDiscard = [];
  }
  if (G.patrolDeck.length === 0) return;
  const card = G.patrolDeck.shift();
  G.patrolDiscard.push(card);
  placePatrol(card);
}

// ---------- Action phase ----------
function handleAction(locId) {
  const missionId=missionIdFromSlot(locId);
  if (missionId) { handleMissionAction(missionId,locId); return; }
  const L = LOCATIONS.find(l=>l.id===locId);

  if (L.type==='field' && G.airdrops[L.id] && G.airdrops[L.id].length) {
    // Free pickup
    airdropPickup(L.id);
    log(`Recogiste ${G.airdrops[L.id]?.length||0} recursos del campo.`);
    returnPawn(locId);
    return;
  }

  if (L.type==='spare' && !G.spareTiles[L.id]) {
    // Occupy spare: cost 2 money
    if ((G.resources.money||0)>=2) {
      showSpareChoices(locId);
      return;
    } else {
      setPrompt('Piso Franco: cuesta 2💰 para ocuparlo.');
      returnPawn(locId);
      return;
    }
  }

  const acts = ACTIONS[L.id];
  // Compute contextual actions (e.g. Pastor Alemán delivery on card's location)
  let contextualActs = [];
  const gsMission = G.missions.find(m => m.id === 'german_shepherds');
  if (gsMission && G.missionCardPositions && G.missionCardPositions['german_shepherds']) {
    const cardLoc = G.missionCardPositions['german_shepherds'] === 'left' ? 'valla' : 'pont_n';
    if (locId === cardLoc) {
      // Per rules: must deliver BOTH food AND medicine to count the day
      contextualActs.push({id:'gs_both', label:'Entregar Comida + Medicina (cuenta 1 día)', cost:[{food:1},{med:1}], reward:[], _context:'gs'});
    }
  }
  if ((!acts || acts.length === 0) && contextualActs.length === 0) {
    setPrompt('No hay acción aquí. Regresando...');
    returnPawn(locId);
    return;
  }
  // Show actions list (only one action per location per turn)
  if (G.actionUsedThisTurn[locId]) {
    setPrompt('Ya usaste la acción aquí este turno.');
    returnPawn(locId);
    return;
  }
  showActionChoices(locId, acts);
}

function showSpareChoices(locId) {
  // Per official rules: 6 specialist tiles, all unique (3 Spare Rooms only).
  // Show only those not yet used in other spare locations.
  const allOpts = [
    {id:'informant', name:'Informador', desc:'Gratis: gana 1 Información.', tile:'🕵️', cost:[], reward:[{info:1}]},
    {id:'protector', name:'Protector', desc:'Gratis: esta ubicación actúa como 2ª Casa Segura.', tile:'🏠', cost:[]},
    {id:'forger', name:'Falsificador', desc:'Gratis: recibes 1 Dinero.', tile:'📜', cost:[], reward:[{money:1}]},
    {id:'smuggler', name:'Contrabandista', desc:'Gratis: elige 3 Medicinas o 3 Comidas.', tile:'🐎', cost:[], reward:'smuggler_choice'},
    {id:'propagandist', name:'Propagandista', desc:'Gratis ★ +1 Moral (instantáneo).', tile:'📢', cost:[], reward:[{moral:1}], instant:true},
    {id:'chemist', name:'Lab. Químico', desc:'Gratis: pagas 1 Medicina → recibes 1 Bomba.', tile:'⚗️', cost:[{med:1}], reward:[{bomb:1}]},
  ];
  // Filter out those already used in any Spare Room
  const opts = allOpts.filter(o => !G._usedSpareTiles || !G._usedSpareTiles.has(o.id));
  let html = `<h3>Elige especialista para ${locName(locId)}</h3>`;
  html += `<p style="font-size:12px; color:#5b4636; margin:0 0 8px;">(Cada ficha solo puede construirse una vez en toda la partida)</p>`;
  html += `<div class="opts">`;
  if (opts.length === 0) {
    html += `<p style="font-size:13px;">No quedan fichas disponibles — todas fueron usadas en otros Pisos Francos.</p>`;
  } else {
    opts.forEach(o => {
      html += `<button data-id="${o.id}">${o.tile} ${o.name}<br><small>${o.desc}</small></button>`;
    });
  }
  html += `<button data-id="cancel" style="background:#c84a3a;color:white;">Cancelar</button>`;
  html += `</div>`;
  modal(html);
  document.querySelectorAll('#modal-content button').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      if (id==='cancel') { closeModal(); returnPawn(locId); return; }
      if (opts.length === 0) { closeModal(); returnPawn(locId); return; }
      const opt = opts.find(o=>o.id===id);
      if (!opt) { closeModal(); returnPawn(locId); return; }
      // Check cost
      const cost = opt.cost || [];
      for (const c of cost) {
        for (const k in c) {
          if ((G.resources[k]||0) < c[k]) {
            closeModal();
            setPrompt(`No tienes suficiente ${k} para construir esto.`);
            returnPawn(locId);
            return;
          }
        }
      }
      // Pay cost
      for (const c of cost) for (const k in c) G.resources[k] -= c[k];
      // Apply reward (using standard gain which respects supply)
      if (opt.reward !== 'smuggler_choice') gain(opt.reward || []);
      // Mark tile as used (so other Spare Rooms can't pick it)
      G.spareTiles[locId] = id;
      if (!G._usedSpareTiles) G._usedSpareTiles = new Set();
      G._usedSpareTiles.add(id);
      log(`Piso Franco ocupado: ${opt.name} en ${locName(locId)}.`);
      if (opt.id === 'protector') {
        log('🏠 Protector: ahora puedes regresar aquí como Casa Segura.');
      } else if (opt.id === 'propagandist') {
        log('📢 Propagandista: +1 Moral (instantáneo).');
      } else if (opt.id === 'chemist') {
        log('⚗️ Lab. Químico: -1 Medicina, +1 Bomba.');
      } else if (opt.id === 'informant') {
        log('🕵️ Informador: +1 Información.');
      } else if (opt.id === 'forger') {
        log('📜 Falsificador: +1 Dinero.');
      } else if (opt.id === 'smuggler') {
        log('🐎 Contrabandista: +3 Medicinas y +3 Comidas.');
      }
      closeModal();
      returnPawn(locId);
      render();
    };
  });
}

function specialistAction(locId, tile) {
  if (tile==='protector') { setPrompt('Protector: este Piso Franco funciona como Casa Segura.'); return true; }
  if (tile==='informant') { gain([{info:1}]); log('🕵️ Informador: +1 Información.'); return true; }
  if (tile==='forger') { gain([{money:1}]); log('📜 Falsificador: +1 Dinero.'); return true; }
  if (tile==='propagandist') { G.moral=Math.min(14,G.moral+1); log('📢 Propagandista: +1 Moral.'); return true; }
  if (tile==='smuggler') {
    modal(`<h3>Contrabandista</h3><p>Elige 3 Medicinas o 3 Comidas.</p><div class="opts"><button data-id="med">💊 3 Medicinas</button><button data-id="food">🍞 3 Comidas</button><button data-id="cancel">Cancelar</button></div>`);
    document.querySelectorAll('#modal-content button').forEach(b=>b.onclick=()=>{
      const id=b.dataset.id; closeModal(); if(id==='cancel'){ returnPawn(locId); return; }
      gain([{[id]:3}]); log(`🐎 Contrabandista: +3 ${id==='med'?'Medicinas':'Comidas'}.`); returnPawn(locId); render();
    }); return 'modal';
  }
  if (tile==='chemist') {
    if((G.resources.med||0)<1){ setPrompt('Lab. Químico: necesitas 1 Medicina.'); return true; }
    G.resources.med--; G.supply.med++; gain([{bomb:1}]); log('⚗️ Lab. Químico: -1 Medicina, +1 Bomba.'); return true;
  }
  return false;
}

function showActionChoices(locId, acts) {
  // If there's exactly one action (and it's not a special context action), auto-execute without modal
  let contextualActs = [];
  // Special: Pastor Alemán card at Valla/Pont du Nord adds delivery actions
  const gsMission = G.missions.find(m => m.id === 'german_shepherds');
  if (gsMission && G.missionCardPositions && G.missionCardPositions['german_shepherds']) {
    const cardLoc = G.missionCardPositions['german_shepherds'] === 'left' ? 'valla' : 'pont_n';
    if (locId === cardLoc) {
      contextualActs.push({id:'gs_both', label:'Entregar Comida + Medicina (cuenta 1 día)', cost:[{food:1},{med:1}], reward:[], _context:'gs'});
    }
  }
  // Only show contextual acts if they're relevant to this location
  // (already filtered above by cardLoc === locId)
  const allActs = [...acts, ...contextualActs];
  if (allActs.length === 0) {
    setPrompt('No hay acciones aquí. Regresando...');
    returnPawn(locId);
    return;
  }
  let html = `<h3>${locName(locId)}</h3>`;
  html += `<div class="opts">`;
  allActs.forEach(a => {
    const costStr = a.cost.map(c=>costToStr(c)).join(' + ') || 'Gratis';
    const rewardStr = rewardToStr(a);
    const alt = a.costAlt ? ` (o ${a.costAlt.map(c=>costToStr(c)).join('+')})` : '';
    html += `<button data-id="${a.id}"><b>${a.label}</b><br><small>Coste: ${costStr}${alt} → ${rewardStr}</small></button>`;
  });
  html += `<button data-id="skip" style="background:#888;color:white;">Saltar</button>`;
  html += `</div>`;
  modal(html);
  document.querySelectorAll('#modal-content button').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      closeModal();
      if (id==='skip') { returnPawn(locId); return; }
      const a = allActs.find(x=>x.id===id);
      executeAction(locId, a);
    };
  });
}

function costToStr(c) {
  const map={food:'🍞',med:'💊',money:'💰',info:'✉',gun:'🔫',bomb:'💣',poison:'🧪',fakeID:'🪪'};
  const parts=[]; for (const k in c) parts.push((c[k]>1?c[k]:'')+map[k]);
  return parts.join('+');
}
function rewardToStr(a) {
  if (a.reward==='airdrop') return '✈ Reabastecimiento aéreo';
  if (a.reward==='recruit') return '👤 Recluta del Café';
  let parts = [];
  for (const c of a.reward) {
    if (c.moral) parts.push((c.moral>0?'+':'')+c.moral+' ★');
    else parts.push(costToStr(c));
  }
  let s = parts.join('+');
  if (a.sideEffect) s += ' ('+(a.sideEffect[0].moral>0?'+':'')+a.sideEffect[0].moral+' ★)';
  return s;
}

function executeAction(locId, a) {
  const L = LOCATIONS.find(l=>l.id===locId);
  // Determine cost (try main, then alt)
  let cost = a.cost;
  if (!canAfford(cost) && a.costAlt) {
    if (canAfford(a.costAlt)) cost = a.costAlt;
  }
  if (!canAfford(cost)) {
    setPrompt('No puedes pagar esa acción.');
    returnPawn(locId);
    return;
  }
  pay(cost);
  // Context actions (Pastor Alemán delivery) don't block other actions at the same location
  if (!a._context) {
    G.actionUsedThisTurn[locId] = true;
  }

  // Reward
  if (a.reward==='airdrop') {
    // pick money (1), gun (1), or food (3)
    showAirdropChoice(locId);
    return;
  } else if (a.reward==='recruit') {
    const isInstant = INSTANT[locId] || (LOCATIONS.find(l=>l.id===locId)?.type==='spare' && G.spareTiles[locId]==='propagandist');
    if (isInstant || canReachSafe(locId)) {
      if (G.cafePawns>0 && G.resistancePawns<5) {
        G.cafePawns--;
        G.resistancePawns++;
        log(`Reclutado del Café. Total peones: ${G.resistancePawns}`);
      } else {
        log('No hay hombres disponibles para reclutar.');
      }
    } else {
      log('⚠ Camino bloqueado — el recluta se pierde si el Trabajador es arrestado.');
    }
  } else {
    const isInstant = INSTANT[locId];
    if (isInstant || canReachSafe(locId)) {
      gain(a.reward);
      if (a.sideEffect) for (const c of a.sideEffect) G.moral = Math.max(0, G.moral + c.moral);
      log(`Acción en ${L.name}: ${a.label}`);
    } else {
      log(`⚠ Camino bloqueado — la recompensa de "${a.label}" se pierde si el Trabajador es arrestado.`);
    }
    // Mission triggers track what was PAID (cost), not the reward, so this
    // still fires even if the reward above was withheld.
    triggerMissionEffects(locId, a, cost);
  }
  // Visual feedback: brief pause so the user sees the action complete
  setTimeout(() => {
    returnPawn(locId);
    render();
  }, 200);
}

function showAirdropChoice(locId) {
  let html = `<h3>✈ Reabastecimiento Aéreo</h3>
    <p>Elige 1 opción (recurso lanzado al Campo):</p>
    <div class="opts">
      <button data-id="money">1 💰</button>
      <button data-id="gun">1 🔫</button>
      <button data-id="food">3 🍞</button>
      <button data-id="cancel" style="background:#888;color:white;">Cancelar</button>
    </div>`;
  modal(html);
  document.querySelectorAll('#modal-content button').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      closeModal();
      if (id==='cancel') { returnPawn(locId); return; }
      // Place in empty field
      const fields = ['campo_l','campo_r'].filter(f=>!G.airdrops[f] || G.airdrops[f].length===0);
      if (fields.length===0) {
        log('No hay Campo libre — lanzamiento perdido.');
        returnPawn(locId);
        render();
        return;
      }
      const target = fields[0];
      const amt = id==='food'?3:1;
      airdropPlace(target, id, amt);
      log(`Lanzamiento aéreo: ${amt}×${id} en ${locName(target)}.`);
      returnPawn(locId);
      render();
    };
  });
}

function triggerMissionEffects(locId, a, cost) {
  const flags = G.missionFlags;
  if (!flags) return;
  // Ensure commonly-used sets exist so we don't crash on accesses
  if (!flags.gs_days) flags.gs_days = new Set();
  if (!flags.gs_per_day) flags.gs_per_day = {};
  if (!flags.un_days) flags.un_days = new Set();
  if (!flags._gsDay) flags._gsDay = {};
  if (!flags._unDay) flags._unDay = {};
  if (!flags.destroyedBridges) flags.destroyedBridges = new Set();
  if (!flags.aa_placed) flags.aa_placed = new Set();
  if (!flags.aa_destroyed) flags.aa_destroyed = new Set();
  if (!flags.tb_explosives) flags.tb_explosives = 0;
  if (!flags.train_bombs) flags.train_bombs = 0;
  if (!flags.assassination_kills) flags.assassination_kills = 0;
  if (!flags.bo_gun) flags.bo_gun = false;
  if (!flags.bo_bomb) flags.bo_bomb = false;
  if (!flags.sab_infiltrations) flags.sab_infiltrations = 0;
  if (!flags.sab_explosives_delivered) flags.sab_explosives_delivered = false;
  if (!flags.infiltration_intel) flags.infiltration_intel = 0;
  if (!flags.infiltration_weapons) flags.infiltration_weapons = false;
  if (!flags.spy_arms_day) flags.spy_arms_day = null;
  if (!flags.un_count) flags.un_count = 0;
  if (!flags.da_done) flags.da_done = false;
  if (!flags.om_set) flags.om_set = new Set();
  if (!flags.frl_obj1) flags.frl_obj1 = false;
  if (!flags.frl_obj2) flags.frl_obj2 = false;
  if (!flags.mhq_obj1) flags.mhq_obj1 = false;
  if (!flags.mhq_obj2) flags.mhq_obj2 = false;
  if (!flags.liberate_done) flags.liberate_done = false;

  // Find the active mission that has THIS location as its mission spot.
  // For our model: the "mission location" is approximated as follows.
  //   - coded_messages, infiltration: mission location is `cafe` (Café)
  //   - destroy_train, aid_the_spy: pont_n
  //   - bomb_officer, take_bridges: mercado
  //   - liberate_town: any (it's about final resources + moral)
  //   - assassination: about killing (handled in killMilitia)
  //   - sabotage: about factory — for now, also cafe (since real board has no factory)
  const dayKey = G.day;

  // ===== CODED MESSAGES — Worker placed at Café before day 6 end, remains until day 10 end
  if (locId === 'cafe') {
    if (flags.cm_placed_day === null || flags.cm_placed_day === undefined) {
      flags.cm_placed_day = dayKey;
    }
    // If the worker is leaving, mark when
    if (flags.cm_left_day === null || flags.cm_left_day === undefined) {
      // Will be set in cleanup at end of maintenance phase
    }
  }

  // ===== INFILTRATION — 2 intel at Café, Worker stays, then 1 gun + 1 bomb
  // We approximate via info action at any radio (intel gathering), then gun+bomb at café.
  if (a.id === 'info') {
    flags.infiltration_intel = (flags.infiltration_intel||0) + 1;
  }
  if (locId === 'cafe') {
    if (a.id === 'gun' || a.id === 'bomb') {
      flags.infiltration_weapons = true;
    }
  }

  // ===== DESTROY THE TRAIN — 3 bombs at Pont du Nord, only days 6-9
  if (a.id === 'bomb' && locId === 'pont_n' && G.day >= 6 && G.day <= 9) {
    flags.train_bombs = (flags.train_bombs||0) + 1;
  }

  // ===== AID THE SPY — Phase 1: 2 guns same day. Phase 2 (next day): 1 money + 2 food.
  // We model guns via 'gun' action at pont_n; money and food via the resource payment at the mission location.
  // For simplicity, any 'gun' action at pont_n counts toward arms.
  if (locId === 'pont_n') {
    if (a.id === 'gun') {
      // Count guns delivered today
      flags._spyGunsDay = flags._spyGunsDay === dayKey ? (flags._spyGunsCount||0)+1 : 1;
      flags._spyGunsCount = 1;
      if (flags._spyGunsDay === dayKey) flags._spyGunsCount = (flags._spyGunsCount||1) + 1;
      // Reset logic: if day changed, reset count
      if (flags._lastSpyDay !== dayKey) { flags._spyGunsCount = 1; flags._lastSpyDay = dayKey; }
      else { flags._spyGunsCount = (flags._spyGunsCount||0) + 1; }
      if (flags._spyGunsCount >= 2) {
        flags.spy_arms_day = dayKey;
      }
    }
  }

  // ===== BOMB FOR THE OFFICER — 1 gun + 1 bomb at Mercado (with moral >= 5)
  if (locId === 'mercado') {
    if (a.id === 'gun') flags.bo_gun = true;
    if (a.id === 'bomb') flags.bo_bomb = true;
  }

  // ===== TAKE OUT THE BRIDGES — 2 explosives at Mercado Negro
  if (locId === 'mercado' && a.id === 'bomb') {
    flags.tb_explosives = (flags.tb_explosives||0) + 1;
  }

  // ===== SABOTAGE — Worker infiltrates factory (cafe) twice, then delivers explosives (bomb)
  if (locId === 'cafe') {
    if (a.id === 'info' || a.id === 'recruit') {
      flags.sab_infiltrations = (flags.sab_infiltrations||0) + 1;
    }
    if (a.id === 'bomb') {
      if ((flags.sab_infiltrations||0) >= 2) flags.sab_explosives_delivered = true;
    }
  }

  // ===== GERMAN SHEPHERDS — 1 medicine AND 1 food at the mission's card location (3 separate days).
  // The card is placed on Valla (left) or Pont du Nord (right).
  // Delivery happens when you pay food OR medicine at that location (and recruit is one way to pay).
  // For simplicity: any action at the card's location that pays food or medicine counts.
  const gsMission = G.missions.find(m => m.id === 'german_shepherds');
  if (gsMission && G.missionCardPositions && G.missionCardPositions['german_shepherds']) {
    const cardSide = G.missionCardPositions['german_shepherds'];  // 'left' or 'right'
    const missionLoc = cardSide === 'left' ? 'valla' : 'pont_n';
    if (locId === missionLoc) {
      // Which resource did we pay?
      let paidFood = false, paidMed = false;
      for (const c of (cost || [])) {
        if (c.food) paidFood = true;
        if (c.med) paidMed = true;
      }
      if (paidFood || paidMed) {
        if (!flags.gs_per_day) flags.gs_per_day = {};
        if (!flags.gs_per_day[G.day]) flags.gs_per_day[G.day] = {food: false, med: false};
        if (paidFood) flags.gs_per_day[G.day].food = true;
        if (paidMed) flags.gs_per_day[G.day].med = true;
        if (flags.gs_per_day[G.day].food && flags.gs_per_day[G.day].med) {
          flags.gs_days.add(G.day);
          log(`🐕 Pastor Alemán: comida y medicina entregadas el día ${G.day} en ${locName(missionLoc)}.`);
        }
      }
    }
  }

  // ===== UNDERGROUND NEWSPAPER — 2 intel at mission location, 3 separate days
  // Mission location: Doctor (we use doctor as the spot). 2 intel per visit.
  if (locId === 'doctor') {
    if (a.id === 'info' || (a.reward && a.reward[0] && a.reward[0].info)) {
      // Track per day
      if (!flags._unDay) flags._unDay = {};
      flags._unDay[G.day] = (flags._unDay[G.day] || 0) + 2;
      if (flags._unDay[G.day] >= 2) flags.un_days.add(G.day);
    }
  }

  // ===== OFFICER'S MANSION — Tag Rue, Pont Lévêque, Pont du Nord (Action Phase); then place Worker at Mercado
  if (['rue','pont_lev','pont_n'].includes(locId)) {
    flags.om_set.add(locId);
  }
  // The "place Worker here to complete" is checked in the mission's check()

  // ===== MILICE PARADE DAY — Worker at Rue Baradat on Day 3,6,9,12,14 (gun action)
  if (locId === 'rue' && [3,6,9,12,14].includes(G.day) && a.id === 'gun') {
    // The worker is arrested (handled in returnPawn). +1 morale.
    G.moral = Math.min(14, G.moral + 1);
    log('🎖 Desfile de la Milicia: +1 Moral. Trabajador arrestado.');
    flags.mpd_done = true;
    // Note: parade day block is set in advanceDay
  }

  // ===== DESTROY AA GUNS — place AA gun tokens on specific locations; destroy via bomb/gun
  // AA gun placement: when a player visits one of the 5 locations with no AA gun yet, place one.
  const AA_LOCS = ['campo_l','campo_r','rue','mercado'];
  if (AA_LOCS.includes(locId) && !flags.aa_placed.has(locId)) {
    // Place the AA gun automatically when visited (rule: tokens placed on both fields, Rue, Black Market, and a 5th here)
    flags.aa_placed.add(locId);
    log(`🎯 AA gun colocada en ${locName(locId)}.`);
  }
  // The mission location itself counts as the 5th AA gun
  if (!flags.aa_placed.has('milice_parade_day_loc')) {
    // Approximated — every mission location gets one AA gun by default at game start.
    // We mark this lazily on first visit to ANY location
  }
  // Destroying an AA gun: spending a bomb OR gun at that location
  if (flags.aa_placed.has(locId) && !flags.aa_destroyed.has(locId) && (a.id === 'bomb' || a.id === 'gun')) {
    flags.aa_destroyed.add(locId);
    log(`💥 AA gun destruida en ${locName(locId)}.`);
  }

  // ===== BOMB THE BARRACKS — Visit mission location multiple times; obj3 needs fakeID+2bomb+gun at field same day
  // Mission location: Mercado (we approximate)
  if (locId === 'mercado') {
    flags.bb_visits = (flags.bb_visits||0) + 1;
  }
  if (a.id === 'fakeID' && locId === 'mercado') {
    if (G.resources.fakeID >= 1 && G.resources.bomb >= 2) {
      G.resources.fakeID--;
      G.resources.bomb -= 2;
      flags._bb_obj3_attempted = true;
    }
  }
  if (a.id === 'gun' && ['campo_l','campo_r'].includes(locId) && flags._bb_obj3_attempted) {
    flags.bb_major = true;
    log('💥 Cuarteles bombardeados — éxito mayor.');
  }

  // ===== MILICE HQ — Obj1: discover plans at Rue Baradat. Obj2: 2 poison at mission location +2 moral +3 soldiers
  if (locId === 'rue' && (a.id === 'info' || (a.reward && a.reward[0] && a.reward[0].info))) {
    flags.mhq_obj1 = true;
  }
  if (a.id === 'poison' && locId === 'mercado') {
    // Track poison used at Mercado; we check 2 in check()
    flags._mhq_poison = (flags._mhq_poison||0) + 1;
  }

  // ===== FREE THE RESISTANCE LEADER — Obj1: Info+Money at this location before day 5. Obj2: Poison OR (FakeID+2guns+med) by day 9/10
  // Mission location: Ultramarinos (we approximate)
  if (locId === 'ultramar') {
    if (a.id === 'info' || (a.reward && a.reward[0] && a.reward[0].info)) {
      flags._frl_info = true;
    }
    if (a.id === 'money' || (a.reward && a.reward[0] && a.reward[0].money)) {
      flags._frl_money = true;
    }
    if (flags._frl_info && flags._frl_money && G.day <= 5) {
      flags.frl_obj1 = true;
    }
    if (a.id === 'poison') {
      if (G.day <= 9) flags.frl_obj2 = true;
    }
    if (a.id === 'fakeID') {
      // Major success requires fakeID+2guns+med same day as day 10
      if (G.day === 10) flags._frl_major_attempted = true;
    }
  }

  // Check mission completion
  for (const m of G.missions) tryMarkMission(m.id);
}

function tryMarkMission(id) {
  const m = G.missions.find(x=>x.id===id);
  if (!m) return;
  const ok = m.check(G);

  // Special: Bomb for Officer blocks 2 locations until completed
  if (m.id === 'bomb_officer') {
    if (!ok) {
      G.blockedLocations = G.blockedLocations || new Set();
      G.blockedLocations.add('campo_r');
      G.blockedLocations.add('spare_ul');
    } else {
      G.blockedLocations.delete('campo_r');
      G.blockedLocations.delete('spare_ul');
    }
  }

  // Special: Take Out the Bridges — once explosives are delivered (2 bombs at mercado),
  // prompt the player to mark which bridge to destroy (at end of action phase)
  // We track this via a one-shot flag.
  if (m.id === 'take_bridges' && ok && !G._tbBridgeChosen) {
    G._tbBridgeChosen = true;
    // Trigger bridge selection modal after current modal closes
    setTimeout(promptDestroyBridge, 100);
  }
  if (!G.missionSuccess[id]) {
    G.missionSuccess[id] = m.success.map(_=>false);
  }
  // Never mark success boxes unless the mission actually has progress.
  if (m.progress) {
    const progress = Math.max(0, Math.min(m.success.length, m.progress(G)));
    for (let j = 0; j < progress; j++) G.missionSuccess[id][j] = true;
  } else if (ok) {
    m.success.forEach((ss,j)=>{ G.missionSuccess[id][j]=true; });
  }
  if (ok) {
    G._missionLogged = G._missionLogged || {};
    if (!G._missionLogged[id]) {
      G._missionLogged[id] = true;
      log(`¡MISIÓN COMPLETADA: ${m.title}!`);
      checkMissionsDone();
    }
  }
}

function checkMissionsDone() {
  const completed = G.missions.filter(m => {
    if (!G.missionSuccess[m.id]) return false;
    return G.missionSuccess[m.id].every(Boolean);
  }).length;
  if (completed>=2) {
    G.gameOver = true; G.win = true;
    log('¡VICTORIA!');
    setTimeout(showGameOver, 200);
  }
}

function returnPawn(locId) {
  // Try to return to safe. If path blocked, pawn arrested (unless INSTANT).
  const isInstant = INSTANT[locId] || (LOCATIONS.find(l=>l.id===locId)?.type==='spare' && G.spareTiles[locId]==='propagandist');
  const reached = canReachSafe(locId);
  if (!reached && !isInstant) {
    // Arrested — animate arrest
    G.placedRes = G.placedRes.filter(p=>p.loc!==locId);
    G.arrested.push('player');
    log(`¡Peón ARRESTADO en ${locName(locId)} al intentar volver!`);
    queueAnim('arrest');
    arrestPawn('return_blocked');
    checkGameOver();
  } else {
    // Pawn reaches safe — animate return
    G.placedRes = G.placedRes.filter(p=>p.loc!==locId);
    log(`Peón regresa a Casa Segura.`);
    queueAnim('return');
  }
  checkGameOver();
}

// Animation queue — visual feedback for pawn movement
var animQueue = [];
var animRunning = false;
function queueAnim(type) {
  animQueue.push(type);
  if (!animRunning) processAnimQueue();
}
function processAnimQueue() {
  if (animQueue.length === 0) { animRunning = false; return; }
  animRunning = true;
  const type = animQueue.shift();
  const sh = document.querySelector('.safehouse-panel');
  if (!sh) { processAnimQueue(); return; }
  const pawns = sh.querySelectorAll('.safehouse-pawn.idle');
  // Find the first idle pawn to animate (closest to the left)
  let target = null;
  for (const p of pawns) {
    if (type === 'return' || type === 'arrest' || type === 'deploy') { target = p; break; }
  }
  if (!target) { processAnimQueue(); return; }
  if (type === 'return') {
    target.classList.add('returning');
    setTimeout(() => { target.classList.remove('returning'); processAnimQueue(); }, 500);
  } else if (type === 'arrest') {
    target.classList.add('arresting');
    setTimeout(() => { target.classList.remove('arresting'); processAnimQueue(); }, 500);
  } else if (type === 'deploy') {
    // Deploy animation handled by the rendering system (pawn becomes 'deploying' class)
    setTimeout(() => { processAnimQueue(); }, 100);
  } else {
    processAnimQueue();
  }
}

function arrestPawn(reason) {
  // Common arrest handler — apply arrestMoralDrop if difficulty requires
  if (G.difficulty && G.difficulty.arrestMoralDrop && G.moral > 0) {
    G.moral = Math.max(0, G.moral-1);
    log('Arresto reduce la moral: -1 ★');
  }
  // Permanent removal: an arrested worker leaves the game for good and can
  // never be placed again. Shrink the active pool so it isn't counted as
  // "home in Casa Segura" anymore (see homeCount = resistancePawns - placedRes.length).
  if (G.resistancePawns > 0) G.resistancePawns--;
}

function promptDestroyBridge() {
  // Show modal with bridge options: Pont Lévêque (south) or Pont du Nord (north)
  let html = `<h3>Tomar los puentes</h3>
    <p>Marca un puente conectado al Mercado Negro para destruirlo. Los Trabajadores no podrán cruzar este puente el resto del juego.</p>
    <div class="opts">
      <button data-id="pont_lev">🌉 Destruir Pont Lévêque (sur)</button>
      <button data-id="pont_n">🌉 Destruir Pont du Nord (norte)</button>
    </div>`;
  modal(html);
  document.querySelectorAll('#modal-content button').forEach(b => {
    b.onclick = () => {
      const bridge = b.dataset.id;
      G.destroyedBridges = G.destroyedBridges || new Set();
      G.destroyedBridges.add(bridge);
      log(`💥 Puente ${locName(bridge)} destruido. Los Trabajadores no pueden cruzar.`);
      closeModal();
      render();
    };
  });
}

function checkGameOver() {
  if (G.gameOver) return;
  if (G.resistancePawns <= 0) {
    // no active resistance workers remain
    G.gameOver = true; G.win = false;
    setTimeout(showGameOver, 200);
  }
  if (G.moral <= 0) {
    G.gameOver = true; G.win = false;
    setTimeout(showGameOver, 200);
  }
}

function showGameOver() {
  let html = `<h3>${G.win?'¡VICTORIA!':'FIN DEL JUEGO'}</h3>`;
  if (G.win) html += `<p>Has completado tus misiones.</p>`;
  else if (G.moral<=0) html += `<p>La moral cayó a 0. El pueblo te ha delatado.</p>`;
  else html += `<p>Todos tus peones han sido arrestados.</p>`;
  html += `<p>Día: ${G.day} · Moral: ${G.moral}</p>`;
  html += `<div class="opts"><button onclick="location.reload()">Nueva partida</button></div>`;
  modal(html);
}

// ---------- Phase transitions ----------
function nextPhase() {
  if (G.phase==='placement') {
    G.phase = 'action';
    setPrompt('Fase de Acción. Toca tus peones para actuar.');
    log('--- Fase de Acción ---');
  } else if (G.phase==='action') {
    G.phase = 'maintenance';
    setPrompt('Fase de Mantenimiento. Pulsando Siguiente turno.');
    log('--- Fase de Mantenimiento ---');
    // Liberation tracking
    if (G.moral>=9) {
      G.missionFlags.free_streak = (G.missionFlags.free_streak||0)+1;
      tryMarkMission('liberar');
    } else {
      G.missionFlags.free_streak = 0;
    }
  } else if (G.phase==='maintenance') {
    advanceDay();
  }
  render();
}

function advanceDay() {
  G.placedPatrols = [];
  const persistent = Object.values(G.missionWorkers||{}).map(w=>w.loc);
  G.placedRes = [];
  G.actionUsedThisTurn = {};
  G.killUsedThisTurn = false;
  G.placementIndex = 0;
  G.day++;
  // Keep mission workers on the board across days; release them after their deadline.
  for (const id of Object.keys(G.missionWorkers||{})) {
    const mw=G.missionWorkers[id];
    if (mw.untilDay && G.day>mw.untilDay) delete G.missionWorkers[id];
  }
  for (const id of Object.keys(G.missionWorkers||{})) {
    const mw=G.missionWorkers[id];
    if (mw) G.placedRes.push({loc:mw.loc,missionId:id});
  }

  // CODED MESSAGES: after finishing day 10, the worker may leave and the mission completes.
  if (G.missionFlags && G.missionFlags.cm_placed_day !== null && G.day > 10) {
    G.missionFlags.cm_left_day = 10;
    G.missionFlags.cm_worker_present = false;
    tryMarkMission('coded_messages');
  }
  // Reset spy per-day tracking for new day
  if (G.missionFlags && G.missionFlags._lastSpyDay !== G.day) {
    G.missionFlags._spyGunsCount = 0;
    G.missionFlags._spyGunsDay = null;
  }

  // Milice Parade Day: block Rue Baradat — Valla edge on parade days (3,6,9,12,14)
  const paradeDays = [3,6,9,12,14];
  if (paradeDays.includes(G.day)) {
    const hasParade = G.missions.some(m => m.id === 'milice_parade_day');
    if (hasParade && G.missionFlags && !G.missionFlags.mpd_done) {
      G.paradeBlocked = true;
      log('🚧 Día de Desfile: camino Rue Baradat ↔ Valla bloqueado.');
    } else {
      G.paradeBlocked = false;
    }
  } else {
    G.paradeBlocked = false;
  }

  // Liberation: track 3 moral+ at end of turn
  if (G.missionFlags) {
    if (G.moral >= 9) {
      G.missionFlags.lib_streak = (G.missionFlags.lib_streak||0) + 1;
      tryMarkMission('liberate_town');
    } else {
      G.missionFlags.lib_streak = 0;
    }
  }
  // Check day-end conditions per difficulty
  const diff = G.difficulty;
  const endDay = diff.endDay || 14; // 14 = end of board (FIN after 14)
  // Normal/Easy: game ends when day passes 14 (i.e., FIN reached). Hard/Difficult: ends AT day 12.
  // very_easy: wraps to day 1 instead of ending.
  if ((diff.id === 'very_easy' && G.day > endDay) ||
      (diff.id !== 'very_easy' && (diff.endDay ? G.day >= diff.endDay : G.day > 14))) {
    if (diff.id === 'very_easy') {
      G.day = 1;
      log('↻ Modo Muy Fácil: el día vuelve a empezar en 1.');
    } else {
      G.gameOver = true; G.win = false;
      setTimeout(showGameOver, 200);
      render();
      return;
    }
  }
  // Reduce moral based on difficulty
  const dropDays = diff.moraleDropOn === 'star' ? [2,5,8,10] : [3,6,9,12];
  if (dropDays.includes(G.day) && G.moral>0) {
    G.moral = Math.max(0, G.moral-1);
    log('La ocupación hace mella: -1 Moral.');
  }
  // Start new day
  G.phase = 'placement';
  setPrompt(`Día ${G.day}: Coloca tus peones.`);
  log(`=== Día ${G.day} ===`);
  checkGameOver();
  render();
}

function killMilitia() {
  if (G.killUsedThisTurn) return;
  if ((G.resources.gun||0)<1) { setPrompt('No tienes Armas.'); return; }
  // Show list of militia to kill
  const ms = G.placedPatrols.filter(p=>p.type==='militia');
  if (ms.length===0) { setPrompt('No hay milicianos en el tablero.'); return; }
  let html = `<h3>Disparar a miliciano</h3><div class="opts">`;
  ms.forEach((m,i)=>{
    html += `<button data-id="${i}">💀 ${locName(m.loc)}</button>`;
  });
  html += `<button data-id="cancel" style="background:#888;color:white;">Cancelar</button></div>`;
  modal(html);
  document.querySelectorAll('#modal-content button').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;
      closeModal();
      if (id==='cancel') return;
      const idx = parseInt(id);
      const target = G.placedPatrols[idx];
      G.placedPatrols.splice(idx,1);
      G.resources.gun--;
      G.soldiers = Math.min(3, G.soldiers+1);
      G.moral = Math.max(0, G.moral-1);
      G.killUsedThisTurn = true;
      log(`💥 Miliciano eliminado en ${locName(target.loc)}. +1 soldado, -1 moral.`);
      // Track kill count for Assassination mission
      if (G.missionFlags) G.missionFlags.assassination_kills = (G.missionFlags.assassination_kills||0) + 1;
      // German Shepherds: killing a militia fails this mission
      const gsMission = G.missions && G.missions.find(m => m.id === 'german_shepherds');
      if (gsMission && G.missionFlags) {
        const days = G.missionFlags.gs_days ? G.missionFlags.gs_days.size : 0;
        if (days < 3) {
          G.missionFlags.gs_failed = true;
          log('⚠️ Has matado un Miliciano — la misión Pastores Alemanes ya no puede completarse.');
        }
      }
      render();
    };
  });
}

  modal(html);
}

function showReference() {
  const html = `<div class="reference-modal">
    <h3>Referencia rápida</h3>
    <img class="reference-image" src="${QUICK_REFERENCE_IMAGE}" alt="Referencia de iconos y reglas de MAQUIS">
    <p class="ref-caption">Iconos y reglas rápidas. Puedes ampliar con el zoom del navegador si lo necesitas.</p>
    <div class="opts"><button onclick="closeModal()">Cerrar</button></div>
  </div>`;
  modal(html);
}

document.getElementById('moral-button').onclick = (ev) => {
  ev.stopPropagation();
  document.getElementById('moral-note').classList.toggle('show');
};
document.addEventListener('click', () => {
  document.getElementById('moral-note')?.classList.remove('show');
});

// ---------- Wire up ----------
document.getElementById('btn-end-phase').onclick = nextPhase;
document.getElementById('btn-kill').onclick = killMilitia;
document.getElementById('btn-help').onclick = showHelp;
document.getElementById('btn-reference').onclick = showReference;
document.getElementById('btn-new').onclick = ()=>{ showDifficultySelector(); };

// ---------- Start ----------
showDifficultySelector();
// Force initial render of safe house so panel is visible even before user picks
renderSafeHouse();
</script>
